# /etc/keyd/default.conf — optional Mac clipboard (Super+C/V/X)
# Input-device level: works on GNOME and KDE.
#
# Ctrl+Insert / Shift+Insert are honored by terminals and GTK/Qt.
# Super+C therefore does not send SIGINT.
#
# Super+A / Super+Z are intentionally omitted (Ctrl+A / Ctrl+Z break terminals).

[ids]
*

[meta]
c = C-insert
v = S-insert
x = C-x
