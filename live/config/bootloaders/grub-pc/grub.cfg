# Sensible live boot menu (GRUB, the UEFI path). live-build copies this file
# over its stock template and fills in the @...@ placeholders at the binary
# stage; config.cfg (graphics, serial console and the 10 s timeout added by
# 0100-grub-serial-timeout.hook.binary) and theme.cfg stay live-build's.
#
# Entry 0 is the default and must stay the console installer: the CI smoke
# test asserts the serial marker from that session. "Try Sensible" boots the
# same live root into the baked desktop (sensible.session=desktop is read by
# sensible-live-desktop.service, systemd.unit= overrides the console default
# target set by 0020-live-boot-to-console.hook.chroot).
#
# Do not write the placeholder names in prose here: live-build also replaces
# their bare forms, without the @ marks, anywhere in this file.
source /boot/grub/config.cfg

menuentry "Install Sensible" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Try Sensible (live desktop, changes nothing on disk)" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ sensible.session=desktop systemd.unit=graphical.target
	initrd	@INITRD_LIVE@
}

menuentry "Install Sensible (fail-safe mode)" {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
