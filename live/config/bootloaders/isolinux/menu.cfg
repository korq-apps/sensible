menu hshift 0
menu width 82

menu title Boot menu
include stdmenu.cfg
include live.cfg
@OPTIONAL_INSTALLER_INCLUDE@
menu begin utilities
	menu label ^Utilities
	menu title Utilities
	include stdmenu.cfg
	label mainmenu
		menu label ^Back..
		menu exit
	include utilities.cfg
menu end

# Auto-boot the live entry after 10 s so headless/serial BIOS machines
# (and impatient humans) boot without touching a key.
timeout 100
ontimeout live-amd64
