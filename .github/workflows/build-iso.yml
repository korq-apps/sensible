name: Build Sensible Live ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Rebuild weekly on Sundays at 03:00 UTC to catch Debian Testing transitions early
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test suite (unit + full-flow integration)
        run: |
          chmod +x tests/run-tests.sh
          tests/run-tests.sh

      - name: ShellCheck (non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning installer/sensible-install.sh installer/lib/*.sh scripts/run-qemu.sh live/build.sh

  build:
    name: Build Live ISO & UEFI Smoke Test
    needs: tests
    runs-on: ubuntu-latest
    # Read-only: this job runs for pull_request and executes PR-controlled
    # build scripts, so it must never hold a token that can write the repo.
    # Publishing happens in the tag-only `release` job below.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Do not leave the job token on disk for the PR-controlled build.
          persist-credentials: false

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: live/.cache/apt
          key: ${{ runner.os }}-apt-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-apt-cache-

      - name: Build Live ISO in Container
        run: |
          chmod +x live/build.sh
          ./live/build.sh

      - name: Install QEMU and OVMF for Smoke Test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Headless QEMU UEFI Boot Smoke Test
        # Same script developers run locally (scripts/smoke-boot.sh), so a
        # green local smoke and a green CI smoke exercise identical logic.
        run: |
          chmod +x scripts/smoke-boot.sh
          scripts/smoke-boot.sh sensible-debian-testing-amd64.iso

      - name: Upload ISO and Checksum Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sensible-debian-testing-amd64
          path: |
            sensible-debian-testing-amd64.iso
            sensible-debian-testing-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14

  # Publication is isolated in its own job so that `contents: write` exists only
  # on tag pushes and never in a run that builds PR-controlled code. It consumes
  # the artifact the build job already produced rather than rebuilding.
  release:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: sensible-debian-testing-amd64

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sensible-debian-testing-amd64.iso
            sensible-debian-testing-amd64.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
