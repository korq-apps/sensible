name: Build Sensible Live ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Rebuild weekly on Sundays at 03:00 UTC to catch Debian Testing transitions early
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test suite (unit + full-flow integration)
        run: |
          chmod +x tests/run-tests.sh
          tests/run-tests.sh

      - name: ShellCheck (non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning installer/sensible-install.sh installer/lib/*.sh scripts/run-qemu.sh live/build.sh

  build:
    name: Build Live ISO & UEFI Smoke Test
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: live/.cache/apt
          key: ${{ runner.os }}-apt-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-apt-cache-

      - name: Build Live ISO in Container
        run: |
          set -o pipefail
          chmod +x live/build.sh
          ./live/build.sh 2>&1 | tee /tmp/livebuild.log

      - name: Assert Secure Boot hook actually ran
        run: |
          # A hook with the wrong name is silently skipped and the build still
          # succeeds (with an unsigned GRUB the SB-off smoke can't detect).
          if ! grep -q "secure-boot hook: shim + Debian-signed GRUB installed" /tmp/livebuild.log; then
            echo "::error::Secure Boot binary hook did not run during live-build."
            exit 1
          fi

      - name: Install QEMU and OVMF for Smoke Test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Headless QEMU UEFI Boot Smoke Test
        # Same script developers run locally (scripts/smoke-boot.sh), so a
        # green local smoke and a green CI smoke exercise identical logic.
        run: |
          chmod +x scripts/smoke-boot.sh
          scripts/smoke-boot.sh sensible-debian-testing-amd64.iso

      - name: Upload ISO and Checksum Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sensible-debian-testing-amd64
          path: |
            sensible-debian-testing-amd64.iso
            sensible-debian-testing-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sensible-debian-testing-amd64.iso
            sensible-debian-testing-amd64.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
